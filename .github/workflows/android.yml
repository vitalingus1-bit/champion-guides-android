name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check preinstalled Android SDK
        run: |
          test -r "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Run catalogue tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew :app:lintDebug
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk'
      - name: Verify APK contains only the sample catalogue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          asset = "assets/catalog.json"
          fixture = Path("app/src/main/assets/catalog.json").read_bytes()
          with ZipFile("app/build/outputs/apk/debug/app-debug.apk") as package:
              assert [path for path in package.namelist() if path.startswith("assets/")] == [asset]
              assert package.read(asset) == fixture
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: champion-guides-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
